
name: CI/CD Pipeline

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML Model
        run: python train.py

      - name: Test ML Model
        run: python test.py

      - name: Check Flask Application
        run: python -c "from app import app; print('Flask API loaded successfully')"

      - name: Build Docker Image
        run: docker build -t iris-prediction:latest .
